<title>Invoice VPS - Canvas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070c15;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.toolbar{width:min(1100px,100%);display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:14px;background:#0b1424;border:1px solid #087bff;border-radius:10px;box-shadow:0 0 25px #006cff33}
input{width:180px;padding:10px 12px;border:1px solid #23649d;border-radius:6px;background:#07101d;color:#fff;outline:0}
input:focus{border-color:#00c8ff;box-shadow:0 0 8px #00bfff55}
button{padding:10px 16px;border:0;border-radius:6px;background:linear-gradient(135deg,#0578ff,#00c9ff);color:#fff;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.12)}
.wrap{width:min(1100px,100%);overflow:auto;background:#020812;border-radius:8px;box-shadow:0 0 30px #0070ff22}
canvas{display:block;width:100%;height:auto}
small{opacity:.6}
</style>

const rows=[
 ['spek',505,273],
 ['paket',505,337],
 ['platform',505,402],
 ['harga',505,562],
 ['metode',505,627],
 ['trx',505,693],

function draw(){
  if(!bg.complete)return;

  ctx.clearRect(0,0,c.width,c.height);
  ctx.drawImage(bg,0,0,c.width,c.height);

  ctx.save();
  /* Diperbesar dari 28px menjadi 34px */
  ctx.font='700 34px Arial,sans-serif';
  ctx.fillStyle='#fff';
  ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.60)';
  ctx.shadowBlur=4;

  for(const [id,x,y] of rows){
    const value=document.getElementById(id).value.trim();
    if(value) ctx.fillText(value,x,y,730);
  }

  ctx.restore();
}

function downloadPNG(){
  draw();
  const a=document.createElement('a');
  a.download='invoice-vps.png';
  a.href=c.toDataURL('image/png');
  a.click();
}

bg.onload=draw;
</script>
